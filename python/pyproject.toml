[project]
name = "vk-gaussian-splatting-tools"
version = "0.1.0"
description = "Python tools for vk_gaussian_splatting: depth streaming backend and offline preprocessing"
authors = [{ name = "maxio" }]
readme = "README.md"
requires-python = ">=3.10"

# Base dependencies - NO torch here (managed by extras)
dependencies = [
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "addict>=2.4",
    "hf-xet>=1.2.0",
    "pydantic-settings>=2.12.0",
    "numba>=0.59",
    # Inference dependencies
    "transformers>=4.44",
    "einops>=0.8",
    "safetensors>=0.4",
    "timm>=1.0.0",
    "e3nn>=0.5.1",
    # Offline/Processing dependencies
    "trimesh>=4.0",
    "scipy>=1.11",
    "tqdm>=4.66",
    "xxhash>=3.4",
    "faiss-cpu>=1.13",
    "plyfile>=1.0",
    "kornia>=0.8",
    "lapjv>=1.3",
    "ben2 @ git+https://github.com/PramaLLC/BEN2.git",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "easydict>=1.13",
    "ninja>=1.11",
    "rembg>=2.0",
    "onnxruntime>=1.18",
    "open3d>=0.19",
    "xatlas>=0.0.9",
    "pyvista>=0.43",
    "pymeshfix>=0.17",
    "igraph>=0.11",
    "utils3d",
    "omegaconf>=2.3",
    "huggingface-hub>=0.20",
    "pycolmap>=0.6",
    "matplotlib>=3.5",
    "evo>=1.0",
    "triton>=2.3.0",
    # Any4D dependencies
    "hydra-core>=1.3",
    "natsort>=8.4",
    "rerun-sdk>=0.15",
]

[project.optional-dependencies]
# =============================================================================
# GPU BACKENDS (mutually exclusive - pick ONE)
# Usage: uv sync --extra cuda   OR   uv sync --extra xpu   OR   uv sync --extra cpu
# =============================================================================

# CUDA (NVIDIA GPUs) - Default for most users
cuda = [
    "torch>=2.7",
    "torchvision>=0.22",
    "triton-windows>=3.2; sys_platform == 'win32'",
]

# XPU (Intel Arc, Intel Data Center GPU)
xpu = [
    "torch>=2.7",
    "torchvision>=0.22",
    "pytorch-triton-xpu>=3.2; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchcodec>=0.1; sys_platform != 'win32'",
]

# CPU-only (no GPU acceleration)
cpu = [
    "torch>=2.7",
    "torchvision>=0.22",
]

# =============================================================================
# FEATURE EXTRAS (can combine with any backend)
# Usage: uv sync --extra cuda --extra backend
# =============================================================================

# Livestream backend (FastAPI + WebSocket)
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.17",
    "av>=12.0",
    "orjson>=3.10",
    "torchcodec>=0.1; sys_platform != 'win32'",  # Video decoding without PNG intermediate
    # Test client dependencies
    "aiohttp>=3.9",
    "pillow>=10.4",
    "numpy>=1.26",
]

# Matrix3D / pytorch3d support (requires CUDA backend)
matrix3d = [
    "pytorch3d>=0.7.8",
    "omegaconf>=2.3",
    "diffusers>=0.31",
    "accelerate>=0.30",
    "scikit-image>=0.22",
    "torchmetrics>=1.0",
    "plotly>=5.0",
    "tensorboard>=2.15",
    "sentencepiece>=0.2",
]

# Diffusion repair models (Qwen-Image-Edit, FLUX.2 Klein with LoRAs)
# Supports GGUF quantized models from ComfyUI for low VRAM usage
diffusion-repair = [
    "diffusers>=0.32",
    "accelerate>=0.30",
    "transformers>=4.51.3",
    "sentencepiece>=0.2",
    "scipy>=1.11",
    "gguf>=0.6",  # For loading GGUF quantized models
]

# TRELLIS.2 GPU extensions (require CUDA compilation - install separately)
trellis2 = [
    # TRELLIS.2 core dependencies are vendored in offline/vkgs_trellis2/
    # Install from source: git clone --recursive https://github.com/microsoft/TRELLIS.2.git
    # cd TRELLIS.2 && . ./setup.sh --basic --nvdiffrast --nvdiffrec --cumesh --o-voxel --flexgemm
    ]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.8",
]

[project.scripts]
# CLI entry points
vkgs-backend = "backend.main:run_server"
vkgs-preprocess = "offline.preprocess:main"
vkgs-generate-masks = "offline.masking:main"
vkgs-export-ply = "offline.export_ply:main"
vkgs-export-gaussian-ply = "offline.export_gaussian_ply:main"
vkgs-depth = "offline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "offline*", "common*", "depth_anything_3*"]

[tool.ruff]
line-length = 100
target-version = "py310"



[tool.ty.src]
include = ["*"]
exclude = ["sharp/"]

[tool.uv]
# Define mutually exclusive GPU backends
conflicts = [
    [
        { extra = "cuda" },
        { extra = "xpu" },
        { extra = "cpu" },
    ],
]

# Package indexes
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch3d-wheels"
url = "https://miropsota.github.io/torch_packages_builder"
explicit = true

# Route packages to specific indexes based on selected extra
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform != 'darwin'" },
]
pytorch-triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform != 'darwin'" },
]
pytorch3d = [
    { index = "pytorch3d-wheels" },
]
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "main" }
